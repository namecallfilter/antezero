# The Rust workspace: the simulator (`sim`), the ground-truth oracle that
# runs the game's own Lua (`sim/oracle`) and the Python bindings (`sim/py`).
[workspace]
members = ["sim", "sim/oracle", "sim/py"]
# The Python extension needs a Python toolchain; build it with maturin
# (`uv sync`).
default-members = ["sim", "sim/oracle"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn" # write Rc::clone(&x), so `.clone()` always means a real copy
doc_paragraphs_missing_punctuation = "warn" # doc comments use full sentences
multiple_inherent_impl = "warn" # one inherent impl block per type, not one per ported class
needless_collect = "warn" # nursery, may false-positive
redundant_clone = "warn" # nursery, may false-positive
tabs_in_doc_comments = "allow" # hard_tabs makes rustfmt indent doc examples with tabs
undocumented_unsafe_blocks = "warn" # every unsafe block needs a `// SAFETY:` comment
unwrap_used = "warn" # use expect("why this can't fail") instead

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

# Tests exercise long random games; keep them reasonably fast.
[profile.test]
opt-level = 2
